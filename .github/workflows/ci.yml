name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Le paquet libsfml-dev d'Ubuntu 24.04 fournit SFML 2.6 ; ubuntu-latest
    # fournit désormais SFML 3, dont l'API des événements est incompatible.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libsfml-dev fonts-dejavu-core

      - name: Compiler
        run: make -j"$(nproc)"

      - name: Tester
        run: make test
